<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SetLog screenshots</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 32px;
        background: #0b0f14;
        color: #f5f7fa;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        letter-spacing: -0.5px;
      }
      p {
        margin: 0 0 28px;
        color: #8a94a6;
        font-size: 14px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 24px;
        max-width: 1100px;
      }
      figure {
        margin: 0;
        background: #121821;
        border: 1px solid #253040;
        border-radius: 20px;
        padding: 14px;
      }
      img {
        display: block;
        width: 100%;
        border-radius: 12px;
        border: 1px solid #253040;
      }
      figcaption {
        margin-top: 10px;
        color: #8a94a6;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      .accent {
        color: #c6ff4a;
      }
    </style>
  </head>
  <body>
    <h1><span class="accent">SetLog</span> screenshots</h1>
    <p>Expo SDK 58 · React Native Web · TypeScript · Supabase-ready. Captured at a 320 px mobile viewport.</p>
    <div class="grid">
      <figure>
        <img src="screenshot-log.jpeg" alt="SetLog Log tab" />
        <figcaption>Log · set entry and rest timer</figcaption>
      </figure>
      <figure>
        <img src="screenshot-history.jpeg" alt="SetLog History tab" />
        <figcaption>History · day-grouped sets and totals</figcaption>
      </figure>
      <figure>
        <img src="screenshot-settings.jpeg" alt="SetLog Settings tab" />
        <figcaption>Settings · Supabase connection and local data</figcaption>
      </figure>
    </div>
  </body>
</html>
